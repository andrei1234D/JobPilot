name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Build, smoke-test and publish the Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Build the dashboard
        run: pnpm --filter @jobpilot/web build

      - name: Package (NSIS installer + portable exe)
        run: pnpm --filter @jobpilot/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:JOBPILOT_HOME = Join-Path $env:RUNNER_TEMP 'jobpilot-home'
          $exe = 'apps/desktop/release/win-unpacked/JobPilot.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }
          Write-Host 'Packaged app started, served the dashboard and answered the API.'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/release/JobPilot-Setup-*.exe
            apps/desktop/release/JobPilot-Portable-*.exe
