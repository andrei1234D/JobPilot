<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>JobPilot</title>
    <style>
      body { margin: 0; width: 280px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { padding: 12px 14px 14px; }
      h1 { margin: 0 0 8px; font-size: 15px; color: #1c5cab; }
      ul { list-style: none; margin: 0 0 10px; padding: 0; }
      li { padding: 3px 0; }
      strong { display: inline-block; min-width: 1.6em; font-size: 15px; }
      button { display: block; width: 100%; margin-top: 6px; padding: 7px 10px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; color: #fff; background: #1c5cab; cursor: pointer; }
      button.secondary { color: inherit; background: transparent; border: 1px solid #c3c2b7; }
      .muted { color: #6b6a65; }
      .small { font-size: 11px; margin: 10px 0 0; }
      .offline { color: #8a5a00; background: #fdf1d3; padding: 8px 10px; border-radius: 8px; }
      @media (prefers-color-scheme: dark) { h1 { color: #6da7ec; } .muted { color: #a3a29b; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
